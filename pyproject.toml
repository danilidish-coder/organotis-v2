[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "organotis"
dynamic = ["version"]
description = "Οργανωτής αρχείων (organotis-v2)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
organotis = "organotis.cli:main"

[tool.setuptools.dynamic]
version = { attr = "organotis.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
