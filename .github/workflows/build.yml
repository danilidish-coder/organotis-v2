name: Δοκιμές και EXE

on:
  push:
    branches: ["feature/**", "main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Για δοκιμαστικό Release: γράψε το tag, π.χ. v0.11.0-test1 (άφησέ το κενό για απλό χτίσιμο)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: Δοκιμές (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Δοκιμές (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Η έξοδος γράφεται και ως σχόλιο-σφάλμα, ώστε να διαβάζεται και χωρίς λήψη των logs.
          python -m pytest -q --tb=short -rf *> pytest-out.txt
          $code = $LASTEXITCODE
          Get-Content pytest-out.txt -Encoding UTF8 | Select-Object -Last 60
          if ($code -ne 0) {
            $txt = Get-Content pytest-out.txt -Raw -Encoding UTF8
            if ($txt.Length -gt 14000) { $txt = $txt.Substring($txt.Length - 14000) }
            $txt = $txt.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=pytest::$txt"
            exit $code
          }
      - name: Δοκιμές (Linux, με εικονική οθόνη)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb python3-tk
          xvfb-run -a python -m pytest -q

  source:
    name: Πηγαίος κώδικας
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Εξαγωγή αρχείων του commit (χωρίς .git)
        run: |
          mkdir organotis-v2-source
          git archive HEAD | tar -x -C organotis-v2-source
      - uses: actions/upload-artifact@v4
        with:
          name: organotis-source
          path: organotis-v2-source
          if-no-files-found: error

  build-exe:
    name: Χτίσιμο EXE (Windows)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pip install .
      - name: Χτίσιμο
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name organotis
          --distpath dist --workpath build/work --specpath build/spec packaging/launcher.py
      - name: Αυτοέλεγχος του EXE (σάρωση, μετακίνηση, αναίρεση, PDF, παράθυρο)
        shell: pwsh
        run: |
          $p = Start-Process dist\organotis.exe -ArgumentList 'selftest','--require-gui','--out','selftest.txt' -Wait -PassThru
          if (-not (Test-Path selftest.txt)) {
            Write-Host "::error title=selftest::Το EXE δεν έγραψε αναφορά αυτοελέγχου (κωδικός $($p.ExitCode))."
            throw "Το EXE δεν έγραψε αναφορά αυτοελέγχου."
          }
          Get-Content selftest.txt -Encoding UTF8
          if ($p.ExitCode -ne 0) {
            $txt = (Get-Content selftest.txt -Raw -Encoding UTF8).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=selftest::$txt"
            throw "Ο αυτοέλεγχος απέτυχε (κωδικός $($p.ExitCode))."
          }
      - name: Έλεγχος εκκίνησης (το παράθυρο ανοίγει και δεν κλείνει μόνο του)
        shell: pwsh
        run: |
          $env:ORGANOTIS_CONFIG = Join-Path $env:RUNNER_TEMP 'smoke-config.json'
          $p = Start-Process dist\organotis.exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            Write-Host "::error title=startup::Το EXE έκλεισε μόνο του (κωδικός $($p.ExitCode))."
            throw "Το EXE έκλεισε μόνο του."
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "Το παράθυρο άνοιξε και έμεινε ζωντανό."
      - name: Αποτύπωμα SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\organotis.exe -Algorithm SHA256).Hash.ToLower()
          "$h  organotis.exe" | Out-File -Encoding ascii dist\organotis.exe.sha256
          Write-Host "SHA-256: $h"
      - uses: actions/upload-artifact@v4
        with:
          name: organotis-windows
          path: |
            dist/organotis.exe
            dist/organotis.exe.sha256
          if-no-files-found: error

  release:
    name: Δοκιμαστικό Release
    # Δημιουργείται: με tag v*, με το κουμπί «Run workflow» + tag, ή με push που έχει «[release]» στο μήνυμα.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
    needs: build-exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: organotis-windows
          path: dist
      - name: Καθορισμός tag και έλεγχος ότι ταιριάζει με την έκδοση του κώδικα
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          code_version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/organotis/__init__.py)
          if [ -n "$INPUT_TAG" ]; then tag="$INPUT_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"
          else tag="v${code_version}-test${GITHUB_RUN_NUMBER}"   # μοναδικό ανά εκτέλεση, δεν αντικαθίσταται ποτέ παλιό Release
          fi
          case "$tag" in v[0-9]*) ;; *) echo "Το tag πρέπει να ξεκινά με v και αριθμό, π.χ. v0.11.0-test1"; exit 1;; esac
          tag_version="${tag#v}"; tag_version="${tag_version%%-*}"
          echo "κώδικας: $code_version, tag: $tag"
          [ "$code_version" = "$tag_version" ] || { echo "Το tag δεν ταιριάζει με την έκδοση του κώδικα"; exit 1; }
          if gh release view "$tag" >/dev/null 2>&1; then echo "Υπάρχει ήδη Release $tag, δεν αντικαθίσταται"; exit 1; fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Δημιουργία Release (δοκιμαστικό, ΟΧΙ εγκεκριμένο)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$TAG"
          sha=$(cut -d' ' -f1 dist/organotis.exe.sha256)
          cp dist/organotis.exe "dist/Organotis_${tag}.exe"
          echo "Organotis_${tag}.exe  SHA256=${sha}" > dist/SHA256.txt
          cat > notes.md <<NOTES
          ## ⚠️ Δοκιμαστική έκδοση: ΔΕΝ είναι εγκεκριμένη

          Μην την εμπιστευτείς για τα πραγματικά σου αρχεία πριν τη δοκιμάσεις.
          Δοκίμασέ την **πρώτα σε αντίγραφο** ενός φακέλου. Τα βήματα είναι στο
          [docs/TEST_CHECKLIST.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/TEST_CHECKLIST.md).

          - Commit: \`${GITHUB_SHA}\`
          - SHA-256 του EXE: \`${sha}\`

          **Windows:** επειδή το αρχείο δεν είναι υπογεγραμμένο, μπορεί να εμφανιστεί
          προειδοποίηση SmartScreen («Περισσότερες πληροφορίες» και μετά «Εκτέλεση ούτως ή άλλως»),
          και κάποια antivirus μπορεί να το σημάνουν κατά λάθος. Σύγκρινε το SHA-256 πριν το ανοίξεις.
          NOTES
          gh release create "$tag" "dist/Organotis_${tag}.exe" dist/SHA256.txt \
            --prerelease --title "${tag} (δοκιμαστική, όχι εγκεκριμένη)" --notes-file notes.md --target "$GITHUB_SHA"
